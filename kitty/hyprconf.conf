# hyprconf's kitty preferences. install.sh's terminal stage appends a single
# `include hyprconf.conf` line to ~/.config/kitty/kitty.conf, LAST — so this
# file restates nothing Omarchy sets, in either of the two places Omarchy now
# sets it: ~/.config/kitty/kitty.conf (the theme include, plus the font_family
# omarchy-font-set appends) and /etc/xdg/kitty/kitty.conf (Omarchy's defaults,
# including `allow_remote_control socket-only` and `listen_on`).
#
# `shell <path to zsh>` is appended here by the installer once zsh is confirmed
# installed; writing it while zsh is missing would leave kitty unable to start.
# Only the terminal runs zsh: the LOGIN shell stays bash, so Omarchy's rc
# chain, session and scripts are untouched.

cursor_trail     1
background_opacity 0.85
