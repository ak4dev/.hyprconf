# hyprconf's kitty preferences, layered on top of Omarchy's kitty.conf via a
# single `include hyprconf.conf` line appended to it.
#
# Omarchy's kitty.conf stays authoritative on purpose: it carries the theme
# include (~/.local/state/omarchy/current/theme/kitty.conf), `listen_on` +
# `allow_remote_control` (which Super+Return needs to inherit the cwd), and the
# `font_family` / `font_size` lines that omarchy-font-set and
# omarchy-display-text-size rewrite in place. Replacing it breaks all of that.
#
# This file is not in /etc/skel, so it survives `omarchy reinstall configs`.
# The `include` line in kitty.conf is not so lucky — the installer re-adds it
# idempotently, and the post-update hook re-asserts it after Omarchy updates.
#
# `shell <path to zsh>` is appended here by the installer once zsh is confirmed
# installed; writing it while zsh is missing would leave kitty unable to start.

cursor_trail     1
background_opacity 0.85
