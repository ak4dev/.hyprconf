[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "hyprconf-tests"
version = "0.1.0"

[tool.pytest.ini_options]
pythonpath = ["stow/hypr/.local/lib"]
testpaths  = ["tests"]
asyncio_mode = "auto"
markers = [
    "vm: live Hyprland session in QEMU/KVM (skipped unless --run-vm passed)",
    "install: full Arch install smoke test (skipped unless --run-install passed)",
]

[tool.coverage.run]
source = ["hyprconf"]
omit   = ["tests/*"]

[tool.coverage.report]
show_missing = true
