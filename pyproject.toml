[project]
name = "hyprconf"
description = "hyprconf — an overlay for Omarchy: hotkeys, look, monitor presets, bar widgets, theme bridges"
# 3.12 is the real floor: CI tests 3.12 and Arch ships ≥3.13.
requires-python = ">=3.12"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-xdist>=3",
]

[tool.pytest.ini_options]
pythonpath = ["lib"]
testpaths  = ["tests"]

[tool.coverage.run]
source = ["hyprconf"]
omit   = ["tests/*"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately bootstrap sys.path before importing (E402) and use short
# loop/lambda vars like `l` (E741); neither warrants churn in test code.
"tests/**" = ["E402", "E741"]
