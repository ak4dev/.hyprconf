[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyprconf"
# Single source of truth: the version is read from the package (bumped by scripts/publish).
dynamic = ["version"]
description = "Hyprland configuration suite — TUI and Arch Linux dotfiles"
# 3.12 is the real floor: CI tests 3.12, Arch ships ≥3.13, and switch_theme.py
# uses 3.12 f-string syntax. (Declared >=3.11 was stale/untested.)
requires-python = ">=3.12"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-xdist>=3",
    "pytest-asyncio>=0.23",
    "textual>=0.50",
    "coverage[toml]",
    "pytest-cov",
]

[tool.setuptools.package-dir]
"" = "stow/hypr/.local/lib"

[tool.setuptools.dynamic]
version = { attr = "hyprconf.__version__" }

[tool.pytest.ini_options]
pythonpath = ["stow/hypr/.local/lib"]
testpaths  = ["tests"]
asyncio_mode = "auto"
markers = [
    "vm: live Hyprland session in QEMU/KVM (skipped unless --run-vm passed)",
    "install: full Arch install smoke test (skipped unless --run-install passed)",
]

[tool.coverage.run]
source = ["hyprconf"]
omit   = ["tests/*"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately bootstrap sys.path before importing (E402) and use short
# loop/lambda vars like `l` (E741); neither warrants churn in test code.
"tests/**" = ["E402", "E741"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
