# Tool config only: nothing packages or pip-installs the repo (AGENTS.md ›
# What hyprconf is), and CI takes pytest from pacman.
[tool.pytest.ini_options]
# modules/<name>/test_<name>.py and tests/, one run through the repo-root
# conftest.py; prepend import mode, so every test basename is unique.
testpaths = ["modules", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
