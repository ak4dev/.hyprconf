name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Least-privilege token: these jobs only read the repo.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# hyprconf is an Arch Linux project, so CI runs inside an archlinux:latest
# container — the same rolling toolchain (pacman, system CPython) its users run.
# GitHub offers no native Arch runner, so the ubuntu-latest host only provides
# the container engine; every step below executes inside the Arch container.
jobs:
  lint:
    name: "Lint (shellcheck + ruff)"
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm --needed git make ruff shellcheck
      - uses: actions/checkout@v4
      - name: ShellCheck (all bash scripts)
        run: make shellcheck
      - name: Ruff (lint + format check)
        run: make lint

  unit-integration:
    name: "Unit + Integration"
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # jq: bin/hyprconf-gaps parses `hyprctl getoption -j` with it.
      # shellcheck: tests/unit/test_yubikey.py lints the generated mkinitcpio
      # drop-in and would otherwise skip silently.
      # diffutils: install.sh compares files with `cmp -s` (a test stub does
      # too); Omarchy has it through mkinitcpio, the bare container does not.
      # lua: luac parses the hypr/*.lua overrides, which would otherwise skip.
      # qt6-declarative: qmllint parses the plugin QML
      # (test_plugin_qml_parses), which would otherwise skip — Arch keeps it
      # in /usr/lib/qt6/bin, where the test looks.
      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm --needed git make python \
            python-pytest python-pytest-xdist jq shellcheck diffutils lua \
            qt6-declarative
      - uses: actions/checkout@v4
      # Same target scripts/publish gates on, so CI and a release run identically.
      - name: Run unit + integration
        run: make test

