name: Tests

on:
  push:
    branches: ["**"]

# Least-privilege token: this job only reads the repo.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# hyprconf is an Arch Linux project, so CI runs inside an archlinux:latest
# container — the same rolling toolchain (pacman, system CPython) its users run.
# GitHub offers no native Arch runner, so the ubuntu-latest host only provides
# the container engine; every step below executes inside the Arch container.
jobs:
  check:
    name: "make check (lint + shellcheck + test)"
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # jq: bin/hyprconf-gaps parses `hyprctl getoption -j` with it.
      # shellcheck: tests/unit/test_yubikey.py lints the generated mkinitcpio
      # drop-in and would otherwise skip silently.
      # diffutils: install.sh compares files with `cmp -s` (a test stub does
      # too); Omarchy has it through mkinitcpio, the bare container does not.
      # lua: luac parses the hypr/*.lua overrides, which would otherwise skip.
      # qt6-declarative: qmllint parses the plugin QML
      # (test_plugin_qml_parses), which would otherwise skip — Arch keeps it
      # in /usr/lib/qt6/bin, where the test looks.
      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm --needed git make ruff python \
            python-pytest python-pytest-xdist jq shellcheck diffutils lua \
            qt6-declarative
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The suite runs as an unprivileged user, the way a developer runs it:
      # root would bypass DAC (every permission assertion passes for free),
      # install.sh's refuse-root preflight would fire on every run, and git
      # would refuse the runner-owned checkout as dubious.
      - name: Run the three gates as an unprivileged user
        run: |
          useradd -m ci
          chown -R ci: "$GITHUB_WORKSPACE"
          # Same target scripts/publish gates on, so CI and a release run
          # identically. Teed, because the raw job log needs admin rights to
          # download (`/actions/jobs/<id>/logs` answers 403 "Must have admin
          # rights to Repository" to anyone else) — so a CI-only failure would
          # otherwise be invisible to the person fixing it. The step below
          # republishes the tail where it can be read.
          su ci -s /bin/bash -c 'set -o pipefail; make check 2>&1 | tee /tmp/hyprconf-check.log'
      - name: Publish the failure where a non-admin can read it
        if: failure()
        run: |
          {
            echo '### `make check` failed'
            echo '```'
            tail -n 150 /tmp/hyprconf-check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The job summary shows only in the web UI. An ::error:: annotation
          # is the one piece of a red run the public API hands back
          # (/check-runs/<id>/annotations), so mirror the tail into one —
          # newlines as %0A, literal % first, per the workflow-command escaping.
          tail -n 40 /tmp/hyprconf-check.log \
            | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
            | awk '{ printf "%s%%0A", $0 }' \
            | { read -r -d '' msg || true; echo "::error title=make check failed::$msg"; }
