name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# hyprconf is an Arch Linux project, so CI runs inside an archlinux:latest
# container — the same rolling toolchain (pacman, system CPython) its users run.
# GitHub offers no native Arch runner, so the ubuntu-latest host only provides
# the container engine; every step below executes inside the Arch container.
jobs:
  lint:
    name: "Lint (shellcheck + ruff)"
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm --needed git make ruff shellcheck
      - uses: actions/checkout@v4
      # Without this, git refuses repo ops (root container vs checkout uid) and
      # `make shellcheck`'s `git ls-files` yields nothing — shellcheck would
      # then pass vacuously, checking zero scripts.
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: ShellCheck (all bash scripts)
        run: make shellcheck
      - name: Ruff (lint + format check)
        run: make lint

  unit-integration:
    name: "Unit + Integration (Tiers 1-2)"
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm --needed git python \
            python-pytest python-pytest-asyncio python-pytest-xdist python-pytest-cov
      - uses: actions/checkout@v4
      # The container runs as root but the checkout is owned by another uid, so
      # git refuses repo operations (e.g. the git-archive tests) with "dubious
      # ownership". Trust the workspace.
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Run tiers 1-2 (unit + integration)
        run: |
          set +e
          for attempt in 1 2 3 4 5; do
            echo "::group::attempt $attempt"
            python -m pytest tests/unit/ tests/integration/ \
              --tb=long -q -n auto -p no:cacheprovider 2>&1 | tee /tmp/pytest.out
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              { echo "FLAKE on attempt $attempt:"; grep -nE '^(FAILED|ERROR)' /tmp/pytest.out; \
                echo '==== TAIL ===='; tail -90 /tmp/pytest.out; } > /tmp/fail.txt
              enc=$(sed 's/%/%25/g' /tmp/fail.txt | sed ':a;N;$!ba;s/\r//g;s/\n/%0A/g' | cut -c1-7000)
              echo "::error title=flake::${enc}"
              exit 1
            fi
          done
          echo "all 5 attempts passed"
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  tui:
    name: "TUI (Tier 3)"
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm --needed git python \
            python-pytest python-pytest-asyncio python-pytest-xdist python-textual
      - uses: actions/checkout@v4
      - name: Run tier 3 (TUI, headless)
        run: python -m pytest tests/tui/ --tb=short -q -n auto
        env:
          PYTHONDONTWRITEBYTECODE: "1"
