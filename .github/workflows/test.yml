name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Lint (shellcheck + ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck (all bash scripts, severity=warning)
        run: make shellcheck

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff (lint + format check)
        run: make lint

  unit-integration:
    name: "Unit + Integration (Tiers 1–2)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest pytest-asyncio pytest-xdist coverage pytest-cov

      - name: Run tests
        run: |
          python -m pytest tests/unit/ tests/integration/ \
            --tb=short -q -n auto \
            --cov=stow/hypr/.local/lib/hyprconf \
            --cov-report=term-missing
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  tui:
    name: "TUI (Tier 3)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest pytest-asyncio pytest-xdist textual

      - name: Run TUI tests
        run: python -m pytest tests/tui/ --tb=short -q -n auto
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  web:
    name: "Web (Vitest + tsc)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate build-time data (themes + version)
        run: npm run generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

  cdk:
    name: "CDK (Vitest)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cdk

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: infra/cdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run
