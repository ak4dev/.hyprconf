mode = "dark"

# The Dracula palette (draculatheme.com); selection/current-line, blue,
# magenta, brown, darker_background and bright_* follow its ANSI-16 terminal
# spec (spec.draculatheme.com). dark_background is deliberate too: Dracula has
# one background, and Omarchy would otherwise derive mix(background, #000, 25%)
# (omarchy-theme-color:236, 4.0.3-1) for the key neovim.lua.tpl, t3code.json.tpl
# and hermes.yaml.tpl read. Keys Omarchy derives to the same value are left out
# (light_foreground -> color7 or foreground, omarchy-theme-color:223).
accent = "#8be9fd"
selection = "#44475a"
muted = "#6272a4"

background = "#282a36"
dark_background = "#282a36"
darker_background = "#21222c"
lighter_background = "#44475a"

foreground = "#f8f8f2"
dark_foreground = "#6272a4"
bright_foreground = "#ffffff"

red = "#ff5555"
yellow = "#f1fa8c"
orange = "#ffb86c"
green = "#50fa7b"
cyan = "#8be9fd"
blue = "#bd93f9"
magenta = "#ff79c6"
brown = "#ffb86c"

bright_red = "#ff6e6e"
bright_yellow = "#ffffa5"
bright_green = "#69ff94"
bright_cyan = "#a4ffff"
bright_blue = "#d6acff"
bright_magenta = "#ff92df"
