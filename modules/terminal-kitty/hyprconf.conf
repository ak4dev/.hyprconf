# hyprconf's kitty preferences, included LAST from ~/.config/kitty/kitty.conf —
# so this file restates nothing Omarchy sets, in either of the two places it now
# sets it: the user file (the theme include, plus the font_family omarchy-font-set
# appends) and /etc/xdg/kitty/kitty.conf (allow_remote_control, listen_on).

cursor_trail     1
background_opacity 0.85
