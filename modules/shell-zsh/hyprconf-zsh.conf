# hyprconf/shell-zsh — kitty runs zsh, and nothing else does: what stays bash,
# and why, is in modules/shell-zsh/README.md.
#
# By name, not by path: kitty shlex-splits this value (resolved_shell,
# /usr/lib/kitty/kitty/utils.py:669-687) and looks the program up on PATH
# (`which(argv[0])`, child.py:491; kitty 0.48.2). ~/.config/kitty/kitty.conf
# `include`s this file; Omarchy's own defaults are in /etc/xdg/kitty/kitty.conf,
# which kitty merges below the user file, and nothing here restates them.
shell zsh
