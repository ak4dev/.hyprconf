# hyprconf/boot-text: the boot log in place of Omarchy's splash. limine-entry-tool
# puts what it reads first LAST on the cmdline (/etc/default/limine leads, then the
# drop-ins in reverse order, each file's lines reversed — read back from the boot
# menu it builds), so this file sorts before omarchy-defaults.conf and its values
# land after "quiet splash loglevel=0 systemd.show_status=false": the kernel and
# systemd take the last of a key. splash=verbose puts Plymouth in its text mode,
# where it still asks for the disk's passphrase or PIN.
# loglevel=4 is this kernel's CONFIG_CONSOLE_LOGLEVEL_DEFAULT: warnings and errors.
KERNEL_CMDLINE[default]+=" splash=verbose loglevel=4 systemd.show_status=true"
