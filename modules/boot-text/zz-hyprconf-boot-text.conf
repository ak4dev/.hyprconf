# hyprconf/boot-text: the boot log in place of Omarchy's splash. Read after
# omarchy-defaults.conf ("quiet splash loglevel=0 systemd.show_status=false"),
# so each value here is the later one and wins. splash=verbose puts Plymouth in
# its text mode, where it still asks for the disk's passphrase or PIN.
# loglevel=4 is this kernel's CONFIG_CONSOLE_LOGLEVEL_DEFAULT: warnings and errors.
KERNEL_CMDLINE[default]+=" splash=verbose loglevel=4 systemd.show_status=true"
