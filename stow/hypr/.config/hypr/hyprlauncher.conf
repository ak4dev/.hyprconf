# hyprlauncher configuration
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlauncher/
# Managed by hyprconf — stow/hypr/.config/hypr/hyprlauncher.conf

general {
    # Force a full keyboard focus grab so keystrokes are never lost to the
    # compositor while the launcher is open.
    grab_focus = true
}

cache {
    # Remember launch frequency so most-used apps float to the top.
    enabled = true
}

finders {
    # Default provider: desktop apps (freedesktop .desktop entries).
    default_finder = desktop

    # No prefix needed for the default desktop finder — just start typing.
    desktop_prefix =

    # Show application icons in the results list.
    desktop_icons = true

    # Prefix shortcuts for additional providers:
    #   . <query>  → Unicode / Emoji search     (e.g.  .smile)
    #   = <expr>   → Calculator / math           (e.g.  =42*1.5)
    #   ' <query>  → Font browser                (e.g.  'JetBrains)
    unicode_prefix = .
    math_prefix    = =
    font_prefix    = '

    # Prefix to prepend to every desktop-app launch command.
    # Uncomment to run apps through a session manager (e.g. uwsm):
    # desktop_launch_prefix = uwsm app --
    desktop_launch_prefix =
}

ui {
    # Launcher window dimensions (width height in pixels).
    # Wide enough to show full app names; tall enough for ~10 results.
    window_size = 560 380
}
