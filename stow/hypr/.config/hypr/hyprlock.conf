general {
    disable_loading_bar = true
    hide_cursor         = true
    grace               = 0
    no_fade_in          = false
}

background {
    monitor     =
    path        = screenshot
    blur_passes = 3
    blur_size   = 7
    brightness  = 0.7
    contrast    = 0.9
    vibrancy    = 0.1696
}

label {
    monitor   =
    text      = cmd[update:1000] echo "<b>$(date +"%H:%M")</b>"
    color     = rgba(255, 255, 255, 0.9)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position  = 0, 120
    halign    = center
    valign    = center
}

label {
    monitor   =
    text      = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color     = rgba(255, 255, 255, 0.7)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position  = 0, 40
    halign    = center
    valign    = center
}

input-field {
    monitor           =
    size              = 280, 52
    outline_thickness = 2
    dots_size         = 0.3
    dots_spacing      = 0.2
    dots_center       = true
    outer_color       = rgba(180, 83, 9, 0.2)
    inner_color       = rgba(18, 10, 4, 0.5)
    font_color        = rgba(232, 213, 192, 0.9)
    fade_on_empty     = true
    placeholder_text  = <i>Password</i>
    check_color       = rgba(101, 163, 13, 1.0)
    fail_color        = rgba(220, 38, 38, 1.0)
    fail_text         = <i>Incorrect ($ATTEMPTS)</i>
    rounding          = 8
    position          = 0, -60
    halign            = center
    valign            = center
}
