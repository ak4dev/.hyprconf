general {
    hide_cursor      = true
    # Draw widgets immediately (background:color first, swapping to the
    # screenshot once its resource is ready) so the lockscreen is up the
    # instant the session locks — matters when locking right before suspend.
    immediate_render = true
    # disable_loading_bar / grace / no_fade_in were removed from general{}:
    # grace is the --grace CLI flag now, fade-in is the animations:fadeIn
    # animation (enabled by default).
}

background {
    monitor     =
    path        = screenshot
    blur_passes = 3
    blur_size   = 7
    brightness  = 0.7
    contrast    = 0.9
    vibrancy    = 0.1696
}

label {
    monitor   =
    text      = cmd[update:1000] echo "<b>$(date +"%H:%M")</b>"
    color     = rgba(255, 255, 255, 0.9)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position  = 0, 120
    halign    = center
    valign    = center
}

label {
    monitor   =
    text      = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color     = rgba(255, 255, 255, 0.7)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position  = 0, 40
    halign    = center
    valign    = center
}

input-field {
    monitor           =
    size              = 280, 52
    outline_thickness = 2
    dots_size         = 0.3
    dots_spacing      = 0.2
    dots_center       = true
    outer_color       = rgba(139, 233, 253, 0.2)
    inner_color       = rgba(40, 42, 54, 0.5)
    font_color        = rgba(248, 248, 242, 0.9)
    fade_on_empty     = true
    placeholder_text  = <i>$PAMPROMPT</i>
    check_color       = rgba(80, 250, 123, 1.0)
    fail_color        = rgba(255, 85, 85, 1.0)
    fail_text         = <i>$PAMFAIL ($ATTEMPTS)</i>
    rounding          = 8
    position          = 0, -60
    halign            = center
    valign            = center
}
