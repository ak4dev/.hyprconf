# hyprconf overrides directory
#
# This file exists so `source = ~/.config/hypr/conf.d/*.conf` always matches at least
# one file (Hyprland errors on unmatched globs).
#
# Add machine-local overrides as normal files in this directory, for example:
#   ~/.config/hypr/conf.d/99-hyprconf-local.conf
#
# Example override:
#   $mainMod = ALT
