# See https://wiki.hypr.land/Configuring/Basics/Variables/
$mainMod = SUPER
# Machine-local overrides (NOT managed by GNU Stow)
# Example: $mainMod = ALT
# Note: Hyprland errors if a `source =` glob matches nothing, so we source a conf.d/
# directory that always contains at least one tracked file.
source = ~/.config/hypr/conf.d/*.conf

bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, Q, exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating
bind = $mainMod, D, exec, $menu
bind = $mainMod, P, pseudo
bind = $mainMod, F, exec, $browser
bind = $mainMod, C, exec, code
bind = $mainMod SHIFT, B, exec, ~/.config/hypr/scripts/switch_monitor.sh bedroom
bind = $mainMod SHIFT, K, exec, ~/.config/hypr/scripts/switch_monitor.sh kitchen

# Move focus with mainMod + arrow keys
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Resize active window
binde = $mainMod SHIFT, left,  resizeactive, -40 0
binde = $mainMod SHIFT, right, resizeactive,  40 0
binde = $mainMod SHIFT, up,    resizeactive,  0 -40
binde = $mainMod SHIFT, down,  resizeactive,  0  40

# Adjust window gaps (inner + outer, proportionate)
bind = $mainMod SHIFT, equal, exec, ~/.config/hypr/scripts/adjust-gaps +
bind = $mainMod SHIFT, minus, exec, ~/.config/hypr/scripts/adjust-gaps -

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1,  workspace, 1
bind = $mainMod, 2,  workspace, 2
bind = $mainMod, F1, workspace, 3
bind = $mainMod, F2, workspace, 4
bind = $mainMod, 5,  workspace, 5
bind = $mainMod, 6,  workspace, 6
bind = $mainMod, 7,  workspace, 7
bind = $mainMod, 8,  workspace, 8
bind = $mainMod, 9,  workspace, 9
bind = $mainMod, 0,  workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1,  movetoworkspace, 1
bind = $mainMod SHIFT, 2,  movetoworkspace, 2
bind = $mainMod SHIFT, F1, movetoworkspace, 3
bind = $mainMod SHIFT, F2, movetoworkspace, 4
bind = $mainMod SHIFT, 5,  movetoworkspace, 5
bind = $mainMod SHIFT, 6,  movetoworkspace, 6
bind = $mainMod SHIFT, 7,  movetoworkspace, 7
bind = $mainMod SHIFT, 8,  movetoworkspace, 8
bind = $mainMod SHIFT, 9,  movetoworkspace, 9
bind = $mainMod SHIFT, 0,  movetoworkspace, 10

bind = $mainMod SHIFT, SPACE, togglefloating
bind = $mainMod SHIFT, F,     fullscreen

# Swap window position
bind = $mainMod SHIFT, A, swapwindow, l
bind = $mainMod SHIFT, D, swapwindow, r
bind = $mainMod SHIFT, W, swapwindow, u
bind = $mainMod SHIFT, S, swapwindow, d

# Special workspace (scratchpad)
bind = $mainMod,       M, togglespecialworkspace, magic
bind = $mainMod SHIFT, M, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume controls
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness controls
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Media controls (requires playerctl)
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPrev,  exec, playerctl previous

# Screenshots
bind = $mainMod SHIFT, 4, exec, hyprshot -m region

# Screen lock
bind = $mainMod,       L,      exec, bash -c 'cliphist wipe; hyprlock'
bind = $mainMod SHIFT, Escape, exec, bash -c 'cliphist wipe; hyprlock'

# Clipboard history
bind = $mainMod SHIFT, V, exec, cliphist list | hyprlauncher --dmenu | cliphist decode | wl-copy

# Toggle native laptop display
bind = $mainMod SHIFT, BACKSPACE, exec, ~/.config/hypr/scripts/toggle-native-display
