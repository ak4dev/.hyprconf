general {
    lock_cmd          = pidof hyprlock || bash -c 'cliphist wipe; hyprlock'
    before_sleep_cmd  = bash -c 'cliphist wipe; hyprlock'
    after_sleep_cmd   = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# Dim screen after 4 minutes of inactivity
listener {
    timeout  = 240
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# Lock screen after 5 minutes of inactivity
listener {
    timeout  = 300
    on-timeout = pidof hyprlock || bash -c 'cliphist wipe; hyprlock'
    on-resume  = hyprctl dispatch dpms on
}

# Turn off displays 30 seconds after locking
listener {
    timeout  = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# Suspend after 30 minutes of inactivity
listener {
    timeout  = 10800
    on-timeout = systemctl suspend
}
