general {
    # Single lock path: the idle listener, before-sleep hook, and the SUPER+L
    # keybind all funnel through `loginctl lock-session`, which fires lock_cmd
    # exactly once. The locker itself is a supervised systemd user unit
    # (hyprlock.service): hyprlock crashes at nearly every suspend exit, and
    # the previous one-shot re-lock at wake raced that crash — the old `pidof`
    # guard saw the doomed instance still alive, skipped the relaunch, then
    # hyprlock died 1-2s later and the session sat on the lockdead screen with
    # no way to log in. systemd owns the single-instance guarantee (start on
    # an active unit is a no-op, replacing the pidof guard) and relaunches on
    # a crash whenever it happens, not just at the wake instant.
    lock_cmd          = systemctl --user start hyprlock.service
    before_sleep_cmd  = loginctl lock-session
    # Wake gets a locker that never crossed the suspend: instances that live
    # through a GPU power cycle are the ones that crash (sometimes 90s after
    # wake), freshly-started ones survive. restart kills any survivor and
    # starts fresh — lock-safe because SIGTERM never unlocks (hyprlock only
    # unlocks on auth/SIGUSR1; the compositor holds the session lock across
    # the handoff). Then relight the displays.
    after_sleep_cmd   = systemctl --user restart hyprlock.service; hyprctl dispatch dpms on
    # 3 = hold the systemd sleep inhibitor until the session is actually locked
    # (ext-session-lock), so the machine can't suspend mid-hyprlock-startup.
    inhibit_sleep     = 3
    ignore_dbus_inhibit = false
}

# Dim screen after 4 minutes of inactivity
listener {
    timeout  = 240
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# Lock screen after 45 minutes of inactivity (routes through lock_cmd above)
listener {
    timeout = 2700
    on-timeout = loginctl lock-session
    on-resume  = hyprctl dispatch dpms on
}

# Turn off displays 90 minutes after inactivity
listener {
    timeout = 5400
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# SECURITY: power OFF after 60 min idle when ON BATTERY (in transit / public).
# This flushes the LUKS key from RAM and re-encrypts at rest, instead of leaving
# the disk decrypted behind a password-only lock screen.  No-op on AC.
listener {
    timeout = 3600
    on-timeout = hyprconf-idle-action poweroff-if-battery
}

# After 3 h idle: suspend on AC (trusted desk), power off on battery (fallback
# if the 60-min poweroff above was inhibited).
listener {
    timeout  = 10800
    on-timeout = hyprconf-idle-action auto
}
