general {
    # Single lock path: the idle listener, before-sleep hook, and the SUPER+L
    # keybind all funnel through `loginctl lock-session`, which fires lock_cmd
    # exactly once. The pidof guard prevents a second hyprlock instance — two
    # lockers fight over ext-session-lock and the loser dies on resume, which
    # is how wakes ended up with no lockscreen.
    lock_cmd          = pidof hyprlock || bash -c 'cliphist wipe; hyprlock'
    before_sleep_cmd  = loginctl lock-session
    # Re-assert the lock on resume: hyprlock can die across a suspend/hibernate
    # cycle (exit-path segfaults in the journal at every "PM: suspend exit").
    # If it survived, the lock_cmd pidof guard makes this a no-op; if it died,
    # this relaunches it before the desktop is exposed. Needs
    # misc:allow_session_lock_restore=true in hyprland.conf.
    after_sleep_cmd   = loginctl lock-session; hyprctl dispatch dpms on
    # 3 = hold the systemd sleep inhibitor until the session is actually locked
    # (ext-session-lock), so the machine can't suspend mid-hyprlock-startup.
    inhibit_sleep     = 3
    ignore_dbus_inhibit = false
}

# Dim screen after 4 minutes of inactivity
listener {
    timeout  = 240
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# Lock screen after 45 minutes of inactivity (routes through lock_cmd above)
listener {
    timeout = 2700
    on-timeout = loginctl lock-session
    on-resume  = hyprctl dispatch dpms on
}

# Turn off displays 90 minutes after inactivity
listener {
    timeout = 5400
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# SECURITY: power OFF after 60 min idle when ON BATTERY (in transit / public).
# This flushes the LUKS key from RAM and re-encrypts at rest, instead of leaving
# the disk decrypted behind a password-only lock screen.  No-op on AC.
listener {
    timeout = 3600
    on-timeout = hyprconf-idle-action poweroff-if-battery
}

# After 3 h idle: suspend on AC (trusted desk), power off on battery (fallback
# if the 60-min poweroff above was inhibited).
listener {
    timeout  = 10800
    on-timeout = hyprconf-idle-action auto
}
