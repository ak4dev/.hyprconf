# Gruvbox Dark Hard Kitty Theme
# Installation instructions:
#
#  cp gruvbox-dark-hard.conf ~/.config/kitty/
#  echo "include gruvbox-dark-hard.conf" >> ~/.config/kitty/kitty.conf
#
# Then reload kitty for the config to take effect.
# Alternatively copy-paste below directly into kitty.conf

foreground            #ebdbb2
background            #282828
selection_foreground  #ebdbb2
selection_background  #3c3836

url_color             #83a598

# black
color0  #1d2021
color8  #928374

# red
color1  #fb4934
color9  #f47c60

# green
color2  #b8bb26
color10 #d8e29f

# yellow
color3  #fabd2f
color11 #fecc70

# blue
color4  #83a598
color12 #8ec07c

# magenta
color5  #d3869b
color13 #ea7bb7

# cyan
color6  #8ec07c
color14 #a9b1b3

# white
color7  #ebdbb2
color15 #ffffff

# Cursor colors
cursor                  #ebdbb2
cursor_text_color       background

# Tab bar colors
active_tab_foreground   #282828
active_tab_background   #ebdbb2
inactive_tab_foreground #282828
inactive_tab_background #928374

# Marks
mark1_foreground        #282828
mark1_background        #fb4934

# Splits/Windows
active_border_color     #ebdbb2
inactive_border_color   #928374

